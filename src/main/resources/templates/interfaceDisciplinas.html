<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CNE - Disciplinas</title>
    <link rel="stylesheet" href="/styles/dashboard.css" />
    <link rel="stylesheet" href="/styles/Interface-disciplinas.css" />
    <link rel="stylesheet" href="/styles/PopUps/AdicionarDisciplina.css" />
    <link rel="shortcut icon" href="/assets/favicon_cne.png" type="image/x-icon"/>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script src="/scripts/disciplinas.js"></script>
  </head>
 
  <body>
    <header class="cabecalho">
      <div class="cabecalho-esquerdo">
        <button class="botao-menu"><i class="fa-solid fa-bars"></i></button>
        <a th:href="@{/cenarios}" class="logo-link">
          <img src="/assets/Logo_cne.png" alt="CNE Logo" class="logo-img" />
        </a>
      </div>
      <div class="cabecalho-direito" style="display: flex; align-items: center; gap: 20px; position: relative;">
            <div class="notificacao-usuarios" id="bell-button">
              <i class="fas fa-bell"></i>
              <span class="ponto-notificacao" id="bell-badge" style="display: none;"></span>

              <!-- Notifications Dropdown -->
              <div class="dropdown-notificacoes" id="notifications-dropdown" style="display: none;">
                <div class="header-notificacoes">
                  <span class="titulo-notificacoes">Notificações</span>
                  <span class="limpar-notificacoes" id="mark-all-read">Marcar tudo como lido</span>
                </div>
                <div class="lista-notificacoes" id="notifications-list">
                  <!-- Dynamic notifications will load here -->
                </div>
              </div>
            </div>
            <a class="botao-voltar" th:href="@{/cenarios}" aria-label="Voltar">
              <i class="fas fa-arrow-left"></i>
            </a>
      </div>
    </header>
 
    <main class="conteudo-principal">
      <div class="card-disciplinas">
        <div class="card-cabecalho">
          <h1 class="titulo-disciplinas">Disciplinas</h1>
          <div class="acoes-disciplinas">
            <button id="openPopup" class="btn-cadastrar-disciplinas">CADASTRAR</button>
          </div>
        </div>
 
        <div class="card-pesquisa">
          <div class="container-pesquisa-disciplinas">
            <input type="text" class="campo-pesquisa-disciplinas" placeholder="Pesquisar" />
            <i class="fas fa-search pesquisa-btn-disciplinas"></i>
          </div>
        </div>
 
        <div class="card-tabela-disciplinas">
          <table class="tabela-disciplinas">
            <thead>
              <tr>
                <th class="sortable" data-column="id">
                  ID
                  <i class="fas fa-arrow-up seta-ordenacao"></i>
                </th>
                <th class="sortable" data-column="nome">
                  Nome
                  <i class="fas fa-arrow-up seta-ordenacao"></i>
                </th>
                <th class="sortable" data-column="cargaHoraria">
                  Carga Horária
                  <i class="fas fa-arrow-up seta-ordenacao"></i>
                </th>
                <th class="sortable" data-column="responsavelNome">
                  Profs. Orientadores
                  <i class="fas fa-arrow-up seta-ordenacao"></i>
                </th>
                <th class="sortable" data-column="responsavelEmail">
                  Email dos Orientadores
                  <i class="fas fa-arrow-up seta-ordenacao"></i>
                </th>
                <th class="sortable" data-column="deleted">
                  Status
                  <i class="fas fa-arrow-up seta-ordenacao"></i>
                </th>
                <th></th> <!-- Empty header for actions -->
              </tr>
            </thead>
            <tbody id="tabela-disciplinas-corpo"></tbody>
          </table>
        </div>
      </div>
    </main>
 
    <script th:src="@{/scripts/main.js}"></script>
    <script th:src="@{/scripts/PopUps/AdicionarDisciplina.js}"></script>
  </body>
</html>

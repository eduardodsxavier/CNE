<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema de Gerenciamento de Usuários</title>
    <link rel="stylesheet" href="/styles/dashboard.css" />
    <link rel="stylesheet" href="/styles/Interface-usuarios.css" />
    <link rel="stylesheet" href="/styles/PopUps/AdicionarUsuario.css" />
    <link rel="shortcut icon" href="/assets/favicon_cne.png" type="image/x-icon"/>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script src="/scripts/usuarios.js"></script>
  </head>

  <body>
    <header class="cabecalho">
      <div class="cabecalho-esquerdo">
        <button class="botao-menu"><i class="fa-solid fa-bars"></i></button>
        <img src="/assets/Logo_cne.png" alt="CNE Logo" class="logo-img" />
      </div>
      <a class="botao-voltar" th:href="@{/cenarios}" aria-label="Voltar">
        <i class="fas fa-arrow-left"></i>
      </a>
    </header>

    <main class="conteudo-principal">
      <div class="card-usuarios">
        <div class="card-cabecalho">
          <h1 class="titulo-usuarios">Usuários</h1>
          <div class="acoes-usuarios">
            <div class="notificacao-usuarios" id="bell-button">
              <i class="fas fa-bell"></i>
              <span class="ponto-notificacao" id="bell-badge" style="display: none;"></span>

              <!-- Notifications Dropdown -->
              <div class="dropdown-notificacoes" id="notifications-dropdown" style="display: none;">
                <div class="header-notificacoes">
                  <span class="titulo-notificacoes">Notificações</span>
                  <span class="limpar-notificacoes" id="mark-all-read">Marcar tudo como lido</span>
                </div>
                <div class="lista-notificacoes" id="notifications-list">
                  <!-- Dynamic notifications will load here -->
                </div>
              </div>
            </div>
            <button id="openPopup" class="btn-cadastrar-usuarios">CADASTRAR</button>
          </div>
        </div>

        <div class="card-pesquisa">
          <div class="container-pesquisa-usuarios">
            <input type="text" class="campo-pesquisa-usuarios" placeholder="Pesquisar" />
            <i class="fas fa-search pesquisa-btn-usuarios"></i>
          </div>
        </div>

        <div class="card-tabela-usuarios">
          <table class="tabela-usuarios">
            <thead>
              <tr>
                <th class="sortable" data-column="RA">
                  Matrícula
                  <i class="fas fa-arrow-up seta-ordenacao"></i>
                </th>
                <th class="sortable" data-column="name">
                  Nome
                  <i class="fas fa-arrow-up seta-ordenacao"></i>
                </th>
                <th class="sortable" data-column="email">
                  Email
                  <i class="fas fa-arrow-up seta-ordenacao"></i>
                </th>
                <th class="sortable" data-column="admin">
                  Cargo
                  <i class="fas fa-arrow-up seta-ordenacao"></i>
                </th>
                <th></th> <!-- Empty header for actions -->
              </tr>
            </thead>
            <tbody id="tabela-usuarios-corpo"></tbody>
          </table>
        </div>
      </div>
    </main>

    <script th:src="@{/scripts/main.js}"></script>
    <script th:src="@{/scripts/PopUps/AdicionarUsuario.js}"></script>
  </body>
</html>
